<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img" aria-labelledby="title desc"><title id="title">Sequência documental e fronteira de custódia</title><desc id="desc">Documentary ordering without a proportional time scale; only the fact of guardian comparison is recorded.</desc>
<rect x="0" y="0" width="1200" height="735" fill="#ffffff"/>
<text x="40" y="25" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#006b64" text-anchor="start" dominant-baseline="text-before-edge">Fig. S2</text>
<text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Sequência documental e fronteira de custódia</text>
<text x="40" y="100" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#42586a" text-anchor="start" dominant-baseline="text-before-edge">Ordem documental; espaçamento não representa tempo decorrido.</text>
<line x1="63" y1="178" x2="63" y2="612" stroke="#d7e0e7" stroke-width="3"/>
<circle cx="63" cy="172" r="11" fill="#006b64"/>
<text x="96" y="150" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Contrato congelado</text>
<text x="96" y="184" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#42586a" text-anchor="start" dominant-baseline="text-before-edge">01 nov. 2026 · 14:29:55 UTC</text>
<text x="96" y="212" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Antes das corridas; identidade do contrato preservada.</text>
<circle cx="63" cy="277" r="11" fill="#9b4b16"/>
<text x="96" y="255" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Primária M1-06</text>
<text x="96" y="289" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#42586a" text-anchor="start" dominant-baseline="text-before-edge">02 nov. · término observado 08:18:27 UTC</text>
<text x="96" y="317" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Inconclusiva; estado nativo incidente; sem selo.</text>
<circle cx="63" cy="382" r="11" fill="#9b4b16"/>
<text x="96" y="360" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Secundária M1-R</text>
<text x="96" y="394" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#42586a" text-anchor="start" dominant-baseline="text-before-edge">02 nov. · término observado 09:53:31 UTC</text>
<text x="96" y="422" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Aceite contratual na primeira tentativa; não independente.</text>
<circle cx="63" cy="487" r="11" fill="#006b64"/>
<text x="96" y="465" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Corpo cego v2 congelado</text>
<text x="96" y="499" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#42586a" text-anchor="start" dominant-baseline="text-before-edge">02 nov. · 09:57:52 UTC</text>
<text x="96" y="527" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Depois da secundária e antes de qualquer comparação.</text>
<circle cx="63" cy="592" r="11" fill="#006b64"/>
<text x="96" y="570" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Comparação concluída pelo dono</text>
<text x="96" y="604" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#42586a" text-anchor="start" dominant-baseline="text-before-edge">Depois do congelamento v2; horário não informado.</text>
<text x="96" y="632" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Somente fato comunicado; conteúdo e resultado fora do projeto.</text>
<text x="40" y="698" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#42586a" text-anchor="start" dominant-baseline="text-before-edge">Nenhuma referência, valor científico ou resultado comparativo é exibido.</text>
</svg>
