<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Procedimento de uma tentativa</title><desc id="desc">Two model turns, one admitted Python execution, and contractual verification.</desc>
<rect x="0" y="0" width="1200" height="510" fill="#ffffff"/>
<text x="40" y="25" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#006b64" text-anchor="start" dominant-baseline="text-before-edge">Fig. 2</text>
<text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Procedimento de uma tentativa</text>
<text x="40" y="100" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#42586a" text-anchor="start" dominant-baseline="text-before-edge">Fluxo contratual; nenhuma resposta ou valor científico.</text>
<rect x="40" y="165" width="250" height="150" fill="#f1f5f8" stroke="#d7e0e7"/>
<text x="58" y="184" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Turno 1</text>
<text x="58" y="235" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Geração de código</text>
<text x="58" y="262" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Até 512 tokens</text>
<line x1="295" y1="238" x2="322" y2="238" stroke="#42586a" stroke-width="3"/>
<line x1="313" y1="229" x2="322" y2="238" stroke="#42586a" stroke-width="3"/>
<line x1="313" y1="247" x2="322" y2="238" stroke="#42586a" stroke-width="3"/>
<rect x="330" y="165" width="250" height="150" fill="#f1f5f8" stroke="#d7e0e7"/>
<text x="348" y="184" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Python</text>
<text x="348" y="235" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Uma execução admitida</text>
<text x="348" y="262" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Até 10 segundos</text>
<line x1="585" y1="238" x2="612" y2="238" stroke="#42586a" stroke-width="3"/>
<line x1="603" y1="229" x2="612" y2="238" stroke="#42586a" stroke-width="3"/>
<line x1="603" y1="247" x2="612" y2="238" stroke="#42586a" stroke-width="3"/>
<rect x="620" y="165" width="250" height="150" fill="#f1f5f8" stroke="#d7e0e7"/>
<text x="638" y="184" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Turno 2</text>
<text x="638" y="235" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Objeto final em JSON</text>
<text x="638" y="262" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Até 2048 tokens</text>
<line x1="875" y1="238" x2="902" y2="238" stroke="#42586a" stroke-width="3"/>
<line x1="893" y1="229" x2="902" y2="238" stroke="#42586a" stroke-width="3"/>
<line x1="893" y1="247" x2="902" y2="238" stroke="#42586a" stroke-width="3"/>
<rect x="910" y="165" width="250" height="150" fill="#f1f5f8" stroke="#d7e0e7"/>
<text x="928" y="184" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">V1–V7</text>
<text x="928" y="235" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Verificação contratual</text>
<text x="928" y="262" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Aceite ou recusa</text>
<text x="40" y="350" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Gate real de tokenização antes de cada geração; contexto 8192 tokens.</text>
<text x="40" y="386" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">Tempo global: 30 minutos. Selo apenas depois do aceite contratual.</text>
<text x="40" y="422" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">A M1-R altera a instrução do turno 2; não constitui réplica independente.</text>
</svg>
