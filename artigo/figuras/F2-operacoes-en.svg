<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc"><title id="title">Primary and secondary runs: operational records</title><desc id="desc">Admitted and operationally completed counts are shown separately; this is not a scientific comparison.</desc>
