<text x="40" y="800" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">M1-06: elapsed time includes shutdown after the cap; the budget was not extended.</text>
<text x="40" y="832" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142a3b" text-anchor="start" dominant-baseline="text-before-edge">A3 = attempt 3: capture failure during turn 2 generation, before verification.</text>
