<text x="980" y="639" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#9b4b16" text-anchor="start" dominant-baseline="text-before-edge">1801.921 s</text>
<text x="40" y="714" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#006b64" text-anchor="start" dominant-baseline="text-before-edge">M1-R</text>
<rect x="170" y="714" width="780" height="25" fill="#e9eef2"/>
<rect x="170" y="714" width="293.683588016" height="25" fill="#006b64"/>
